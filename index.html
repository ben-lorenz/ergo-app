<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ergo-App</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <header>

            <h1>Therapie-App</h1>

            <nav class="tabs">

                <button
                    class="tab active"
                    data-page="memoryPage">

                    Merkspiel

                </button>

                <button
                    class="tab"
                    data-page="clockPage">

                    Uhrentraining

                </button>

            </nav>

        </header>


        <section
        id="memoryPage"
        class="page active">
        <section class="settings">

            <h2>Einstellungen</h2>

            <div class="setting">

                <label for="count">Anzahl Zeichen</label>

                <input
                    type="number"
                    id="count"
                    min="3"
                    max="15"
                    value="6">

            </div>


            <div class="setting">

                <label>Zeichenart</label>

                <div class="radioGroup">

                    <label>
                        <input
                            type="radio"
                            name="mode"
                            value="numbers">

                        Zahlen
                    </label>

                    <label>
                        <input
                            type="radio"
                            name="mode"
                            value="letters">

                        Buchstaben
                    </label>

                    <label>
                        <input
                            type="radio"
                            name="mode"
                            value="mixed"
                            checked>

                        Gemischt
                    </label>

                </div>

            </div>

            <div class="setting">

                <label>Darstellung</label>

                <div class="radioGroup">

                <label>
                    <input
                        type="radio"
                        name="displayMode"
                        value="colors"
                        checked>

                    mit Farben
                </label>


                <label>
                    <input
                        type="radio"
                        name="displayMode"
                        value="hiddenColors">

                    Farben erst beim Abdecken
                </label>


                <label>
                    <input
                        type="radio"
                        name="displayMode"
                        value="none">

                Keine Farben
                </label>

            </div>

    



        <div class="setting">

            <label>

                <input
                    type="checkbox"
                    id="shuffleColors">

            Farben nach der Merkphase mischen

            </label>

            </div>



        <div class="setting">

            <label>Merkzeit</label>

                <div class="radioGroup">

                    <label>

                        <input
                            type="radio"
                            name="timeMode"
                            value="automatic"
                            checked>

                        Automatisch
                        <small>(1 Sek./Zeichen)</small>

                    </label>

                    <label>

                        <input
                            type="radio"
                            name="timeMode"
                            value="manual">

                        Manuell

                    </label>

                    <label>

                        <input
                            type="radio"
                            name="timeMode"
                            value="custom">

                        Benutzerdefiniert

                    </label>

                </div>

            </div>


            <div
                class="setting"
                id="customTimeContainer">

                <label for="time">

                    Zeit (Sekunden)

                </label>

                <input
                    type="number"
                    id="time"
                    value="5"
                    min="1">

            </div>



            <div class="buttonBar">

                <button id="startBtn">

                    Spiel starten

                </button>

                <button
                    id="endMemoryBtn">

                    Merkphase beenden

                </button>

                <button
                    id="checkBtn">

                    Auswerten

                </button>

                <button
                    id="newRoundBtn">

                    Neue Runde

                </button>

            </div>

        </section>



        <section id="gameArea">

            <h2 id="phaseTitle">

                Bereit

            </h2>


            <div
                id="sequence"
                class="sequence">

            </div>


            <div
                id="answers"
                class="answers">

            </div>


            <div
                id="result">

            </div>

        </section>
        </section>


<section
    id="clockPage"
    class="page">

    <div class="settings">

        <!-- =========================
             MODUS
             ========================= -->

        <h3>Modus</h3>

            <div class="radioGroup">

    <label>
        <input
            type="radio"
            name="clockMode"
            value="label"
            checked>

        Ziffernblatt beschriften
    </label>

    <label>
        <input
            type="radio"
            name="clockMode"
            value="reading">

        Uhrzeit ablesen
    </label>

    <label>
        <input
            type="radio"
            name="clockMode"
            value="setting">

        Uhrzeit einstellen
    </label>

            </div>



<!-- ================================================= -->
<!-- BESCHRIFTEN -->
<!-- ================================================= -->

            <div id="labelSettings">

    <h3>Schwierigkeit</h3>

    <div class="radioGroup">

        <label>
            <input
                type="radio"
                name="clockDifficulty"
                value="easy"
                checked>

            Leicht (3 / 6 / 9 / 12)
        </label>

        <label>
            <input
                type="radio"
                name="clockDifficulty"
                value="medium">

            Mittel (12)
        </label>

        <label>
            <input
                type="radio"
                name="clockDifficulty"
                value="hard">

            Schwer
        </label>

    </div>



    <h3>Eingabeverhalten</h3>

    <div class="radioGroup">

        <label>
            <input
                type="radio"
                name="clockInputMode"
                value="manual">

            Manuell
        </label>

        <label>
            <input
                type="radio"
                name="clockInputMode"
                value="clockwise"
                checked>

            Im Uhrzeigersinn
        </label>

        <label>
            <input
                type="radio"
                name="clockInputMode"
                value="random">

            Zufällig
        </label>

    </div>

            </div>



<!-- ================================================= -->
<!-- ABLESEN -->
<!-- ================================================= -->

            <div
    id="readingSettings"
    style="display:none;">

    <h3>Schwierigkeit</h3>

    <div class="radioGroup">

        <label>
            <input
                type="radio"
                name="readingDifficulty"
                value="easy"
                checked>

            Volle Stunden
        </label>

        <label>
            <input
                type="radio"
                name="readingDifficulty"
                value="medium">

            15-Minuten-Schritte
        </label>

        <label>
            <input
                type="radio"
                name="readingDifficulty"
                value="hard">

            5-Minuten-Schritte
        </label>

        <label>
            <input
                type="radio"
                name="readingDifficulty"
                value="everyMinute">

            Jede Minute
        </label>

    </div>

            </div>



<!-- ================================================= -->
<!-- EINSTELLEN -->
<!-- ================================================= -->

            <div
    id="settingSettings"
    style="display:none;">

    <h3>Schwierigkeit</h3>

    <div class="radioGroup">

        <label>
            <input
                type="radio"
                name="settingDifficulty"
                value="easy"
                checked>

            Volle Stunden
        </label>

        <label>
            <input
                type="radio"
                name="settingDifficulty"
                value="medium">

            15-Minuten-Schritte
        </label>

        <label>
            <input
                type="radio"
                name="settingDifficulty"
                value="hard">

            5-Minuten-Schritte
        </label>

        <label>
            <input
                type="radio"
                name="settingDifficulty"
                value="everyMinute">

            Jede Minute
        </label>

    </div>

            </div>

    </div>


    <!-- =========================
         UHR
         ========================= -->

    <div id="clockContainer"></div>


    <!-- =========================
         UHRZEIT EINGABE
         ========================= -->

    <div
        id="readingInputs"
        style="display:none;">

        <input
            type="text"
            id="answerHour"
            maxlength="2"
            placeholder="HH"
            inputmode="numeric">

        <span class="timeSeparator">
            :
        </span>

        <input
            type="text"
            id="answerMinute"
            maxlength="2"
            placeholder="MM"
            inputmode="numeric">

    </div>


    <!-- =========================
         BUTTONS
         ========================= -->

    <div class="buttonBar">

        <button id="startClockBtn">
            Neue Aufgabe
        </button>

        <button id="checkClockBtn">
            Prüfen
        </button>

    </div>


    <div id="clockResult"></div>

</section>


        </section>

        <script src="script.js"></script>

        <script src="js/TherapyClock.js"></script>

        <script src="js/clockSettingMode.js"></script>

        <script src="js/clockTraining.js"></script>

    </div>

    </body>
</html>
